name: AWS KMS Integration (LocalStack)

on:
  workflow_dispatch: {}
  # Run weekly (UTC) to verify LocalStack/KMS compatibility and detect regressions
  schedule:
    - cron: '0 3 * * 0'
  # Allow running this workflow on PRs to main so maintainers can validate changes
  pull_request:
    branches:
      - main

jobs:
  kms-integration:
    name: KMS integration tests (requires LocalStack)
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        options: >-
          -e SERVICES=kms
          --health-cmd="curl -sS http://localhost:4566/health || exit 1"
          --health-interval=5s --health-timeout=2s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi

      - name: Wait for LocalStack
        run: |
          for i in {1..20}; do
            if curl -sS http://localhost:4566/health; then
              echo LocalStack ready && break
            fi
            sleep 2
          done

      - name: Run KMS integration tests
        env:
          AWS_KMS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          pytest -q tests/test_aws_kms_localstack.py -q
