name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sealledger
          POSTGRES_PASSWORD: sealledger
          POSTGRES_DB: sealledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sealledger" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U sealledger && break || sleep 1
          done

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+psycopg://sealledger:sealledger@localhost:5432/sealledger
          PYTHONPATH: src
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t sealledger:ci .
