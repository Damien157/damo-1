[tool.poetry]
name = "sealed-ledger"
version = "0.1.0"
description = "Audit-ready SealedLedger prototype"
authors = ["Dev <dev@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.99.1"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
pydantic = "^2.5"
cryptography = "^41.0"
pysha3 = "^1.0"
python-dotenv = "^1.0"
sqlalchemy = "^2.0"
alembic = "^1.11"
"psycopg[binary]" = "^3.2"
rfc3161ng = "^0.9"
boto3 = "^1.30"
moto = "^4.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core>=1.7.1"]
build-backend = "poetry.core.masonry.api"
